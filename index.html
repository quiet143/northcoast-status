<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>North Coast status</title>
<style>
:root { color-scheme: light; --page: #f5f4f1; --surface: #fcfcfb; --hairline: #d9d8d2; --text: #0b0b0b; --text-2: #52514e; --accent: #1c5cab; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #111110; --surface: #1a1a19; --hairline: #3a3a36; --text: #f0efec; --text-2: #c3c2b7; --accent: #6da7ec; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 24px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0 0 16px; color: var(--text-2); font-size: 14px; }
label { display: block; font-size: 14px; margin-bottom: 6px; }
input[type=password] { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--page); border: 1px solid var(--hairline); border-radius: 8px; }
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.remember { display: flex; gap: 8px; align-items: center; margin: 14px 0 18px; }
.remember label { margin: 0; }
button { width: 100%; padding: 10px 12px; font: inherit; font-weight: 600; color: var(--surface); background: var(--text); border: 0; border-radius: 8px; cursor: pointer; }
button[disabled] { opacity: 0.6; cursor: default; }
#message { min-height: 21px; margin: 12px 0 0; font-weight: 600; color: var(--text); }
</style>
</head>
<body>
<form id="unlock" autocomplete="on">
  <h1>North Coast status</h1>
  <p>Enter the password to view the dashboard.</p>
  <input type="text" name="username" value="northcoast" autocomplete="username" hidden>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
  <div class="remember"><input type="checkbox" id="remember"><label for="remember">Remember on this device</label></div>
  <button type="submit" id="submit">Unlock</button>
  <p id="message" role="alert"></p>
</form>

const STORE = "northcoast-status-key";
const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

async function decryptWith(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}

async function deriveKey(password) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iterations }, material, 256);
  return new Uint8Array(bits);
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

function remembered() {
  try { return localStorage.getItem(STORE); } catch (e) { return null; }
}

// Web Crypto only exists on https (and localhost); say so instead of failing as a wrong password.
const SECURE = !!(window.crypto && crypto.subtle);
if (!SECURE) {
  document.getElementById("submit").disabled = true;
  document.getElementById("message").textContent = "This page only unlocks over a secure (https) connection.";
}

(async () => {
  const saved = remembered();
  if (!saved || !SECURE) return;
  try { show(await decryptWith(bytes(saved))); }
  catch (e) { try { localStorage.removeItem(STORE); } catch (e2) {} }
})();

document.getElementById("unlock").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("submit");
  const message = document.getElementById("message");
  button.disabled = true;
  message.textContent = "Unlocking…";
  try {
    const rawKey = await deriveKey(document.getElementById("password").value);
    const html = await decryptWith(rawKey);
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(STORE, btoa(String.fromCharCode(...rawKey))); } catch (e) {}
    }
    show(html);
  } catch (e) {
    message.textContent = "That password didn’t work. Try again.";
    button.disabled = false;
  }
});
</script>
